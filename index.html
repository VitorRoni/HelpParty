<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/output.css">
    <title>Help Party</title>
    <!-- Background:#2d325o e #424769 px horizontal py vertical pe end ps start-->
  </head>

  <body class="p-0 m-0 bg-[#2d3250] text-white">
    <div id="header"></div>
    <main class="flex">
      <aside class="filter flex bg-[#424769] w-65 h-100 mt-5 rounded-lg p-5 ml-5">
        <form>
          <h1 class="text-xl mb-3">Filtro</h1>
          <div class="option flex flex-col gap-3 me-4">
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="doces" name="doces" value="doces" class="" />
              <label for="doces">Doce</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="bebidas" name="bebidas" value="bebidas" />
              <label for="bebidas">Bebida</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="buffet" name="buffet" value="buffet" />
              <label for="buffet">Buffet</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="decoracao" name="decoracao" value="decoracao" />
              <label for="decoracao">Decoração</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="traje" name="traje" value="traje" />
              <label for="traje">Traje</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="acessorio" name="acessorio" value="acessorio" />
              <label for="acessorio">Acessrio</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="lembrancacas" name="lembrancacas" value="lembrancacas" />
              <label for="lembrancacas">Lembranças</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="musica" name="musica" value="musica" />
              <label for="musica">Música</label>
            </div>
            <div class="flex center gap-3 me-4">
              <input type="checkbox" id="regiao" name="regiao" value="regiao" />
              <label for="regiao">Região</label>
            </div>
          </div>
        </form>
      </aside>

      <div class="card grid grid-cols-4 gap-5 mt-5 pl-20">

        <div id="card"></div>
        <div id="card"></div>
        <div id="card"></div>

      </div>
    </main>

    <script src="./js/components/header.js"></script>
    <script src="./js/components/card.js"></script>
  </body>

</html>
